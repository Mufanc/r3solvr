name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, workflow]
  pull_request:
    branches: [master, workflow]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
